<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI — Grand Line Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}body{min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#06182a,#0a3650 45%,#071a29);position:relative}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.12),transparent 32%),linear-gradient(180deg,transparent 45%,rgba(0,0,0,.45));pointer-events:none}.ocean{position:fixed;inset:0;overflow:hidden;pointer-events:none}.wave{position:absolute;left:-10%;width:120%;height:150px;border-radius:50%;border-top:2px solid rgba(130,220,255,.22);animation:drift 9s ease-in-out infinite}.w1{bottom:-75px}.w2{bottom:-105px;opacity:.55;animation-delay:-3s}.w3{bottom:-130px;opacity:.3;animation-delay:-6s}@keyframes drift{50%{transform:translateX(4%) translateY(-12px)}100%{transform:translateX(0)}}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:75px 75px;opacity:.12}.ship{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(1000px,110vw);height:34vh;min-height:190px;opacity:.72}.hull{position:absolute;bottom:0;left:12%;width:76%;height:44%;background:linear-gradient(#6f3519,#291108);border:4px solid #160a05;border-radius:0 0 48% 48%/0 0 70% 70%;box-shadow:inset 0 12px 20px rgba(255,190,70,.12)}.deck{position:absolute;bottom:37%;left:17%;width:66%;height:20px;background:#54230f;border:3px solid #1a0a05;border-radius:50%}.mast{position:absolute;bottom:32%;left:50%;width:13px;height:68%;background:linear-gradient(90deg,#2a1207,#8c4c22,#2a1207);transform:translateX(-50%)}.sail{position:absolute;bottom:48%;left:50%;width:42%;height:44%;transform:translateX(-4%);background:linear-gradient(135deg,#f2e6c9,#bca77b);clip-path:polygon(0 0,100% 12%,100% 88%,0 100%);filter:drop-shadow(0 8px 8px rgba(0,0,0,.45));opacity:.9}.flag{position:absolute;bottom:98%;left:50%;width:75px;height:48px;background:#b91419;clip-path:polygon(0 0,100% 18%,78% 50%,100% 82%,0 100%);transform:translateX(-5%)}.flag:after{content:"☠";position:absolute;inset:0;display:grid;place-items:center;color:#f7d77b;font-size:25px}.cannon{position:absolute;bottom:23%;width:55px;height:13px;background:#111;border-radius:20px}.c1{left:18%}.c2{right:18%}.container{position:relative;z-index:2;width:min(720px,92vw);margin:7vh auto 32vh}.card{position:relative;padding:38px 34px 32px;background:linear-gradient(145deg,rgba(10,22,34,.93),rgba(18,34,45,.88));border:1px solid rgba(238,191,89,.45);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(14px);text-align:center;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(255,215,120,.08),transparent 70%);pointer-events:none}.brand{font-family:'Pirata One',Georgia,serif;font-size:clamp(42px,8vw,70px);letter-spacing:2px;margin:0;color:#f4c85c;text-shadow:3px 4px 0 #53170d,0 0 25px rgba(255,191,61,.2)}.subtitle{margin:5px 0 22px;color:#c8d8de;font-size:14px;letter-spacing:2px;text-transform:uppercase}.route{color:#e7bd58}.mic{position:relative;width:92px;height:92px;border:3px solid #e5b74d;border-radius:50%;font-size:34px;cursor:pointer;background:radial-gradient(circle,#b72a25,#741817 65%,#3a0c0c);box-shadow:0 0 0 7px rgba(230,183,77,.08),0 10px 35px rgba(0,0,0,.45);transition:.25s}.mic:hover{transform:translateY(-3px) scale(1.03)}.mic.listening{animation:pulse 1.15s infinite;background:radial-gradient(circle,#df4035,#7d1414)}@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(219,57,45,.08),0 0 35px rgba(255,74,55,.45)}}.status{margin:18px auto 10px;color:#e9c86a;font-weight:600}.command{min-height:24px;color:#d5e0e4;font-size:15px}.editor{display:none;margin-top:24px;padding:20px;text-align:left;border:1px solid rgba(238,191,89,.3);background:rgba(0,0,0,.2);border-radius:16px}.recipient{color:#e7bd58;font-size:13px;margin-bottom:10px}input,textarea{width:100%;margin:7px 0;padding:12px 13px;background:#08131e;color:#fff;border:1px solid #40515d;border-radius:10px;outline:none}input:focus,textarea:focus{border-color:#dcb653}textarea{height:130px;resize:vertical}button.action{padding:11px 16px;margin:6px 5px 0 0;border:1px solid #9c7a32;border-radius:9px;cursor:pointer;color:#fff;background:#263746}.primary{background:linear-gradient(135deg,#b62a20,#761414)!important;border-color:#e2b74e!important}.badge{display:inline-flex;gap:7px;align-items:center;margin-top:24px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:11px;color:#a9bdc6}.dot{width:7px;height:7px;border-radius:50%;background:#62d88b;box-shadow:0 0 10px #62d88b}@media(max-width:600px){.card{padding:28px 18px}.container{margin-top:4vh}.ship{height:25vh}.sail{width:48%}.brand{font-size:48px}}
</style>
</head>
<body>
<div class="ocean"><div class="stars"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div><div class="ship"><div class="mast"></div><div class="sail"></div><div class="flag"></div><div class="deck"></div><div class="hull"></div><div class="cannon c1"></div><div class="cannon c2"></div></div></div>
<main class="container"><section class="card"><h1 class="brand">Nova AI</h1><p class="subtitle">Your crew is ready · <span class="route">Grand Line Console</span></p><button id="mic" class="mic" aria-label="Start voice command">🎙️</button><div id="status" class="status">Tap the Den Den Mushi 🎙️</div><div id="command" class="command"></div><div id="editor" class="editor"><div id="recipient" class="recipient"></div><input id="subject" placeholder="Email subject"><textarea id="body" placeholder="Email body"></textarea><button id="open" class="action primary">⚓ Open in Gmail</button><button id="regen" class="action">↻ Regenerate</button></div><div class="badge"><span class="dot"></span> NOVA SYSTEM ONLINE · SAILING THE GRAND LINE</div></section></main>
<script>
const $=id=>document.getElementById(id);const mic=$("mic"),status=$("status"),commandBox=$("command"),editor=$("editor"),recipient=$("recipient"),subject=$("subject"),body=$("body");const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition,listening=false,lastCommand="",emailGenerated=false,generatingEmail=false,youtubeTab=null;if(!SR){status.textContent="Speech recognition unavailable in this browser";mic.disabled=true}else{recognition=new SR();recognition.lang="en-US";recognition.continuous=false;recognition.interimResults=false;recognition.onstart=()=>{listening=true;mic.classList.add("listening");status.textContent="Listening across the Grand Line..."};recognition.onend=()=>{listening=false;mic.classList.remove("listening")};recognition.onerror=e=>{listening=false;mic.classList.remove("listening");status.textContent="Voice error: "+e.error};recognition.onresult=e=>{const text=e.results[0][0].transcript.trim();if(!text){status.textContent="No command detected";return}lastCommand=text;commandBox.textContent="You: "+text;processCommand(text)};mic.onclick=()=>{if(listening)return;try{recognition.start()}catch(e){console.log(e)}}}function isGmail(command){return /\bcreate\b/i.test(command)&&/\bemail\b/i.test(command)}function isYouTube(command){return /\bplay\b/i.test(command)||/\bsong\b/i.test(command)}async function processCommand(command){const gmail=isGmail(command),youtube=isYouTube(command);if(gmail){if(generatingEmail){status.textContent="The crew is already preparing your email...";return}if(emailGenerated&&command===lastCommand){status.textContent="Email already generated.";return}generatingEmail=true;status.textContent="Preparing the message...";try{const response=await fetch("/agent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command})});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||"Email request failed");showEmail(data);emailGenerated=true}catch(error){console.error(error);status.textContent=error.message||"Email generation failed"}finally{generatingEmail=false}return}else if(youtube){status.textContent="Searching the seas for your song...";try{const response=await fetch("/youtube/play",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command})});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||"YouTube request failed");playYouTube(data)}catch(error){console.error(error);status.textContent=error.message||"YouTube request failed"}return}else status.textContent="Try 'create email' or 'play song'."}function showEmail(data){recipient.dataset.email=data.recipient||"";recipient.textContent=data.recipient?"To: "+data.recipient:"Recipient not specified";subject.value=data.subject||"";body.value=data.body||"";editor.style.display="block";status.textContent="Message ready. Review before sending."}$("open").onclick=()=>{const url="https://mail.google.com/mail/u/0/?"+new URLSearchParams({view:"cm",fs:"1",to:recipient.dataset.email||"",su:subject.value,body:body.value});const win=window.open(url,"NovaGmail");if(!win)status.textContent="Please allow popups for this site."};$("regen").onclick=()=>status.textContent="Email already generated. Edit the existing message.";function playYouTube(data){if(!youtubeTab||youtubeTab.closed)youtubeTab=window.open(data.url,"NovaYouTube");else{youtubeTab.location.href=data.url;youtubeTab.focus()}status.textContent="Playing your song 🎵"}
</script>
</body>
</html>
